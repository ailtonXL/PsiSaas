{% extends 'base.html' %}{% block content %}<section class="login-card"><div class="brand">◒ PsiSaas</div><h1>{{ title }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">{% if kind=='forgot' %}<label>E-mail<input name="email" type="email" autocomplete="email" required></label>{% elif kind=='reset' %}<label>Nova senha<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirmar senha<input name="confirm" type="password" minlength="12" autocomplete="new-password" required></label>{% else %}<label>Código do aplicativo autenticador<input name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></label>{% endif %}<button>Continuar</button></form><a href="/login">← Entrar</a></section>{% endblock %}
